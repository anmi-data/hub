name: Deploy ANMI Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-anmi-hub
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, anmi-hub]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_BASE_PATH: /

      - run: rsync -az --delete dist/ /srv/anmi/www/anmi-hub/
