name: Deploy ANMI Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-anmi-hub
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: [self-hosted, anmi-hub]

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site with public PostHog configuration
        shell: bash
        env:
          VITE_BASE_PATH: /
          VITE_POSTHOG_PROJECT_TOKEN: ${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: |
          if [[ -z "$VITE_POSTHOG_PROJECT_TOKEN" || -z "$VITE_POSTHOG_HOST" ]]; then
            echo "::error::Set repository variables VITE_POSTHOG_PROJECT_TOKEN and VITE_POSTHOG_HOST before deploying."
            exit 1
          fi
          npm run build

      - run: rsync -az --delete dist/ /srv/anmi/www/anmi-hub/
